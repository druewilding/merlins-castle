<!doctype html>
<!-- Mockup of the illustrated title screen. Open locally: the image is in art/originals (not committed). Screenshots: title-laptop.jpg, title-phone.jpg. -->
<html>
  <head>
    <meta charset="utf-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Cinzel:wght@600;700&display=block"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #070b1f;
        overflow: hidden;
      }
      .scene {
        position: fixed;
        inset: 0;
        background: url(../../art/originals/scenes/title.png) center 35% / cover;
      }
      .scene::after {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at 50% 100%, rgba(7, 11, 31, 0.75), transparent 60%);
      }
      .titles {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 9vh;
        text-align: center;
        color: #f3e9d2;
      }
      h1 {
        margin: 0;
        font:
          700 clamp(40px, 7vw, 96px) / 1 Cinzel,
          serif;
        letter-spacing: 0.04em;
        color: #ffe08a;
        text-shadow:
          0 0 18px rgba(255, 200, 90, 0.55),
          0 2px 0 rgba(0, 0, 0, 0.6);
      }
      .by {
        margin: 0.5em 0 0;
        font:
          italic clamp(18px, 2vw, 26px) "IM Fell English",
          serif;
        opacity: 0.9;
      }
      .begin {
        display: inline-block;
        margin-top: 2em;
        padding: 0.7em 1.8em;
        font:
          600 clamp(14px, 1.2vw, 17px) Cinzel,
          serif;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        text-decoration: none;
        color: #e9dcff;
        border: 1px solid rgba(201, 184, 255, 0.55);
        border-radius: 999px;
        background: rgba(20, 16, 50, 0.45);
        box-shadow: 0 0 18px rgba(170, 140, 255, 0.25);
      }
      .begin:hover,
      .begin:focus-visible {
        color: #fff6d6;
        border-color: #ffe08a;
        box-shadow: 0 0 22px rgba(255, 216, 120, 0.45);
        outline: none;
      }
      @media (max-aspect-ratio: 1/1) {
        .scene {
          background-position: 42% 30%;
        }
        .titles {
          bottom: 12vh;
          padding: 0 1rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="scene"></div>
    <div class="titles">
      <h1>Merlin's Castle</h1>
      <p class="by">By Anita Straker</p>
      <a class="begin" href="#">Begin</a>
    </div>
  </body>
</html>
