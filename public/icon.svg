<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2154"/>
      <stop offset="1" stop-color="#3a2a6b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9a3"/>
      <stop offset="1" stop-color="#d9a441"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#sky)"/>
  <circle cx="12" cy="13" r="1.2" fill="#fff6d8"/>
  <circle cx="51" cy="10" r="1" fill="#fff6d8"/>
  <circle cx="54" cy="24" r="0.8" fill="#fff6d8"/>
  <g fill="url(#gold)">
    <!-- the golden spire -->
    <path d="M32 4 L37.5 22 H26.5 Z"/>
    <rect x="27" y="22" width="10" height="18"/>
    <!-- side towers -->
    <path d="M17 18 L22 28 H12 Z"/>
    <rect x="13" y="28" width="8" height="24"/>
    <path d="M47 18 L52 28 H42 Z"/>
    <rect x="43" y="28" width="8" height="24"/>
    <!-- the wall, with battlements -->
    <path d="M21 36 h3 v-3 h3 v3 h3 v-3 h4 v3 h3 v-3 h3 v3 h3 V52 H21 Z"/>
    <rect x="9" y="52" width="46" height="4" rx="1"/>
  </g>
  <!-- door and windows glowing dark -->
  <path d="M28.5 52 V45 a3.5 3.5 0 0 1 7 0 V52 Z" fill="#2a1f55"/>
  <rect x="31" y="27" width="2" height="5" rx="1" fill="#2a1f55"/>
  <rect x="16" y="33" width="2" height="5" rx="1" fill="#2a1f55"/>
  <rect x="46" y="33" width="2" height="5" rx="1" fill="#2a1f55"/>
</svg>
